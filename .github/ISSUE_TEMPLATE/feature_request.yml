name: Feature request
description: Propose a scoped capability
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the engineering problem before the proposed solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Reliability or security constraints
      description: What must remain true if this is implemented?
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Production scenario, study, failure report, benchmark, or comparable system behavior.
