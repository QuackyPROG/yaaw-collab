name: Bug report
description: Report reproducible incorrect behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Provide the smallest reproducible case. Do not include secrets."
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, task graph, timing, or failure sequence.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and relevant external services.
